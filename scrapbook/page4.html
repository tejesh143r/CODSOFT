<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pick Me / Lose Me - Scrapbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-frame">
    <header class="scrap-header">
      <div class="logo">ScrapLove</div>
      <nav>
        <a href="index.html">Cover</a>
        <a href="page1.html">Memories</a>
        <a href="page2.html">Quotes</a>
        <a href="page3.html">Stickers</a>
        <a href="page5.html">Forever</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="note-panel note-glow">
        <h1>Pick Me or Lose Me</h1>
        <p>Tap the one that feels like a playful chase—because every click should be a little adventure.</p>
      </section>

      <div class="play-card">
        <button id="pickButton" class="btn btn-play">Pick Me</button>
        <button id="loseButton" class="btn btn-play btn-alt">Lose Me</button>
      </div>

      <div class="play-message" id="playMessage">Try to catch the one that wants to stay with you.</div>

      <div class="page-actions">
        <a class="btn btn-secondary" href="page5.html">Next Page</a>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
