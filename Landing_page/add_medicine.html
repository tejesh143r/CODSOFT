<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine — SmartMed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">SmartMed</div>
            <ul class="nav-links">
                <li><a href="Index.html">Home</a></li>
                <li><a href="get_started.html">Get Started</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="schedule.html">Schedules</a></li>
                <li><a href="medicines.html">My Medicines</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main">
        <div class="page-header">
            <h2>Add a Medicine</h2>
            <p class="small-note">Enter your medicine details to keep SmartMed ready for reminders.</p>
        </div>
        <form id="add-med-form" class="form-grid form-card">
            <div class="form-group">
                <label>Medicine Name</label>
                <input class="input-field" type="text" name="name" placeholder="e.g., Atorvastatin" required>
            </div>

            <div class="form-group">
                <label>Dosage</label>
                <input class="input-field" type="text" name="dosage" placeholder="e.g., 10 mg" required>
            </div>

            <div class="form-group">
                <label>Frequency</label>
                <input class="input-field" type="text" name="frequency" placeholder="e.g., Twice a day">
            </div>

            <div class="form-group">
                <label>Start Date</label>
                <input class="input-field" type="date" name="start">
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea class="input-field" name="notes" rows="4" placeholder="Optional notes"></textarea>
            </div>

            <button type="submit" class="primary-btn">Save Medicine</button>
        </form>

        <p class="small-note">(This is a static demo page — in a full app this form would save to your account.)</p>
    </main>

    <footer>
        <p>© 2026 SmartMed</p>
    </footer>

    <div id="app-notification" class="app-notification hidden" role="alert" aria-live="assertive">
        <div class="app-notification-card">
            <strong>SmartMed Alert</strong>
            <p id="app-notification-text"></p>
            <button class="secondary-btn" onclick="hideInAppNotification()">Dismiss</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        initMedicineForm();
        startReminderChecker();

        document.getElementById('add-med-form').addEventListener('submit', function(e){
            e.preventDefault();
            const form = e.target;
            const medicine = {
                name: form.name.value,
                dosage: form.dosage.value,
                frequency: form.frequency.value,
                start: form.start.value,
                notes: form.notes.value
            };
            saveMedicine(medicine);
            showInAppNotification('Medicine saved. Proceeding to Set Schedule...');
            setTimeout(() => {
                window.location.href = 'set_schedule.html';
            }, 900);
        });
    </script>
</body>
</html>
